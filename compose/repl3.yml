# GENERATED by bench/make_compose.py - do not edit by hand.
# Three independent single-drive servers. MinIO has no N-way replication storage class, so the benchmark client writes every object to all three.
x-minio: &minio
  image: ${MINIO_IMAGE:?set MINIO_IMAGE}
  command: server /data --console-address ":9001"
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
  networks:
    - minio-net

services:
  minio1:
    <<: *minio
    hostname: minio1
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/node1/drive1:/data
    ports:
      - "9101:9000"
  minio2:
    <<: *minio
    hostname: minio2
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/node2/drive1:/data
    ports:
      - "9102:9000"
  minio3:
    <<: *minio
    hostname: minio3
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/node3/drive1:/data
    ports:
      - "9103:9000"

networks:
  minio-net:
    driver: bridge
