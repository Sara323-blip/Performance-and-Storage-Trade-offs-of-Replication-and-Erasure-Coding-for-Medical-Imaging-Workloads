# GENERATED by bench/make_compose.py - do not edit by hand.
# 6 drives (3 nodes x 2) = one 6-drive erasure set; EC:2 gives 4 data + 2 parity.
x-minio: &minio
  image: ${MINIO_IMAGE:?set MINIO_IMAGE}
  command: server --console-address ":9001" http://minio{1...3}/data{1...2}
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    MINIO_STORAGE_CLASS_STANDARD: "EC:${PARITY:?set PARITY}"
  networks:
    - minio-net

services:
  minio1:
    <<: *minio
    hostname: minio1
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/node1/drive1:/data1
      - ${DATA_DIR:?set DATA_DIR}/node1/drive2:/data2
    ports:
      - "9101:9000"
  minio2:
    <<: *minio
    hostname: minio2
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/node2/drive1:/data1
      - ${DATA_DIR:?set DATA_DIR}/node2/drive2:/data2
    ports:
      - "9102:9000"
  minio3:
    <<: *minio
    hostname: minio3
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/node3/drive1:/data1
      - ${DATA_DIR:?set DATA_DIR}/node3/drive2:/data2
    ports:
      - "9103:9000"

networks:
  minio-net:
    driver: bridge
