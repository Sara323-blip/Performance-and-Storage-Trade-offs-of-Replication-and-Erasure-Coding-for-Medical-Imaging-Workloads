version: '3.8'

services:
  minio-replica1:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data/replica1:/data
    ports:
      - "9001:9001"
      - "9101:9000"
    networks:
      - minio-net

  minio-replica2:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data/replica2:/data
    ports:
      - "9002:9001"
      - "9102:9000"
    networks:
      - minio-net

  minio-replica3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data/replica3:/data
    ports:
      - "9003:9001"
      - "9103:9000"
    networks:
      - minio-net

networks:
  minio-net:
    driver: bridge
