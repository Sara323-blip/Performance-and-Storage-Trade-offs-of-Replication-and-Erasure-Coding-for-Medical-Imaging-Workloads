version: '3.8'

x-minio-common: &minio-common
  image: quay.io/minio/minio:RELEASE.2024-12-13T22-19-12Z
  command: server --console-address ":9001" http://minio{1...5}/data{1...2}
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin123
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 30s
    timeout: 20s
    retries: 3
  networks:
    - minio-cluster

services:
  minio1:
    <<: *minio-common
    container_name: minio1
    hostname: minio1
    volumes:
      - ./data/node1/drive1:/data1
      - ./data/node1/drive2:/data2
    ports:
      - "9001:9001"
      - "9101:9000"

  minio2:
    <<: *minio-common
    container_name: minio2
    hostname: minio2
    volumes:
      - ./data/node2/drive1:/data1
      - ./data/node2/drive2:/data2
    ports:
      - "9002:9001"
      - "9102:9000"

  minio3:
    <<: *minio-common
    container_name: minio3
    hostname: minio3
    volumes:
      - ./data/node3/drive1:/data1
      - ./data/node3/drive2:/data2
    ports:
      - "9003:9001"
      - "9103:9000"

  minio4:
    <<: *minio-common
    container_name: minio4
    hostname: minio4
    volumes:
      - ./data/node4/drive1:/data1
      - ./data/node4/drive2:/data2
    ports:
      - "9004:9001"
      - "9104:9000"

  minio5:
    <<: *minio-common
    container_name: minio5
    hostname: minio5
    volumes:
      - ./data/node5/drive1:/data1
      - ./data/node5/drive2:/data2
    ports:
      - "9005:9001"
      - "9105:9000"

networks:
  minio-cluster:
    driver: bridge
