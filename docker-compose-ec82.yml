version: '3.8'

services:
  minio1:
    image: minio/minio:latest
    command: server --console-address ":9001" http://minio{1...5}/data{1...2}
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_STORAGE_CLASS_STANDARD: "EC:8"
    volumes:
      - ./data/node1/drive1:/data1
      - ./data/node1/drive2:/data2
    ports:
      - "9001:9001"
      - "9101:9000"
    networks:
      - minio-net

  minio2:
    image: minio/minio:latest
